<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3FB0D6" />

    <!-- Apply the saved theme before first paint so dark-mode users never see a
         light flash. Defaults to light. Kept tiny + inline on purpose. -->
    <script>
      try {
        if (localStorage.getItem("oneleet_theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>

    <title>OneLeet — AI-powered LEET / Lateral Entry Entrance Test preparation</title>
    <meta
      name="description"
      content="Crack LEET (Lateral Entry Entrance Test) and get into the 2nd year of B.Tech after your diploma. Free past papers, exam-pattern mock tests, notes and AI practice — for Bihar, UP, Delhi, Haryana, Punjab, Rajasthan, MP, Maharashtra, Gujarat and more."
    />
    <link rel="canonical" href="https://www.oneleet.in/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- Open Graph / social -->
    <meta property="og:site_name" content="OneLeet" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OneLeet — AI-powered LEET / Lateral Entry preparation" />
    <meta
      property="og:description"
      content="Your diploma-to-B.Tech shortcut. Real past papers, exam-pattern mock tests and AI practice for the Lateral Entry Entrance Test."
    />
    <meta property="og:url" content="https://www.oneleet.in/" />
    <meta property="og:image" content="https://www.oneleet.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OneLeet — AI-powered LEET / Lateral Entry preparation" />
    <meta
      name="twitter:description"
      content="Your diploma-to-B.Tech shortcut. Real past papers, mock tests and AI practice for LEET."
    />
    <meta name="twitter:image" content="https://www.oneleet.in/og-image.png" />

    <!-- Fonts: preconnect + display=swap so text paints immediately (better LCP
         than @import). Trimmed to the weights actually used and dropped italics
         (synthesised when needed) to cut render-blocking font requests. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Mulish:wght@300..800&family=Poppins:wght@400;500;600;700;800;900&display=swap"
    />

    <!-- Entity graph: who OneLeet is + site search action. Mirrors the static SEO pages. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "EducationalOrganization",
            "@id": "https://www.oneleet.in/#organization",
            "name": "OneLeet",
            "alternateName": "OneLeet — LEET Preparation",
            "url": "https://www.oneleet.in/",
            "logo": "https://www.oneleet.in/favicon.svg",
            "image": "https://www.oneleet.in/og-image.png",
            "description": "OneLeet is an AI-powered preparation platform for the LEET / Lateral Entry Entrance Test, helping diploma holders get into the 2nd year of B.Tech with real past papers, exam-pattern mock tests, notes and AI practice.",
            "email": "help@oneleet.in",
            "areaServed": "IN",
            "knowsAbout": [
              "LEET",
              "Lateral Entry Entrance Test",
              "Lateral entry into B.Tech",
              "Diploma to B.Tech",
              "Engineering entrance preparation"
            ],
            "parentOrganization": { "@type": "Organization", "name": "StaplerLabs Private Limited" }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.oneleet.in/#website",
            "url": "https://www.oneleet.in/",
            "name": "OneLeet",
            "publisher": { "@id": "https://www.oneleet.in/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://www.oneleet.in/leet/?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>

    <script type="module" src="/src/main.jsx"></script>

</html>
